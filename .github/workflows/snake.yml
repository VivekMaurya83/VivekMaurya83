name: Generate GitHub Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # 📥 Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 📁 Ensure output directory exists with runner permissions
      - name: Prepare output directory
        run: mkdir -p dist

      # 🐍 Contribution Snake
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 🔒 Fix permissions (in case Docker container wrote root-owned files)
      - name: Fix file permissions
        run: sudo chown -R $USER:$USER dist

      # 🚀 Publish generated assets
      - name: Push Profile Assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}