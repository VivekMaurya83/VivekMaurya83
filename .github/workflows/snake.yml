name: Generate GitHub Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # 📥 Checkout repo (needed for activity graph action)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 Contribution Snake
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 📈 Contribution Activity Graph
      - name: Generate Activity Graph
        uses: Ashutosh00710/github-readme-activity-graph@v2
        with:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_FILE: dist/activity-graph.svg
          HIDE_BORDER: true
          BG_COLOR: 0D0221
          COLOR: A78BFA
          LINE: 8B5CF6
          POINT: E9D5FF
          AREA: true
          AREA_COLOR: 6D28D9
          CUSTOM_TITLE: Contribution Activity

      # 🚀 Publish generated assets
      - name: Push Profile Assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
